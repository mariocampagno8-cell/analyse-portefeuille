name: Surveillance — urgences

# Toutes les deux heures pendant les séances. N'envoie QUE l'urgent :
# décrochage au-delà de trois écarts-types, publication sous 48 h, sortie de
# la zone de tolérance. Les jours calmes, ce canal reste muet — c'est
# précisément ce qui rend ses messages crédibles.

on:
  schedule:
    - cron: "0 8,10,12,14 * * 1-5"    # 10h, 12h, 14h, 16h Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  urgence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy requests
      - name: Alertes de marché
        env:
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          MODE_MACRO: "urgence"
          PRESSE: "0"
        run: python veille_macro.py
      - name: Alertes de portefeuille
        env:
          URL_FEUILLE: ${{ secrets.URL_FEUILLE }}
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          MODE_VEILLE: "urgence"
          QUOTA_PAR_PASSAGE: "5"
        run: python veille.py
      - name: Mémoriser
        if: always()
        run: |
          if [[ -n $(git status --porcelain etat_veille.json) ]]; then
            git config user.name "veille"
            git config user.email "veille@users.noreply.github.com"
            git add etat_veille.json
            git commit -m "Urgence : etat"
            git pull --rebase --autostash || true
            git push
          fi
