name: Veille — phase 1

# Trois moments, un seul fichier.
#   7h30  matin  : rappel J-1 des publications du lendemain
#   séance       : alertes de prix et de risque, quatre passages
#   vendredi 18h30 : digest hebdomadaire
#
# Le budget de notifications est applique par le code, pas par le planificateur :
# quatre push sonores et douze messages par jour au maximum, silence 21h-7h.

on:
  schedule:
    - cron: "30 5 * * 1-5"     # 7h30 Paris — rappel J-1
    - cron: "45 7 * * 1-5"     # 9h45  — ouverture européenne
    - cron: "15 12 * * 1-5"    # 14h15 — avant l'ouverture américaine
    - cron: "30 15 * * 1-5"    # 17h30 — clôture européenne
    - cron: "30 16 * * 5"      # vendredi 18h30 — digest
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "seance"
        type: choice
        options: [seance, matin, digest]

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install yfinance pandas numpy requests

      - name: Déterminer le moment
        id: moment
        run: |
          if [[ -n "${{ inputs.mode }}" ]]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.schedule }}" == "30 5 * * 1-5" ]]; then
            echo "mode=matin" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.schedule }}" == "30 16 * * 5" ]]; then
            echo "mode=digest" >> $GITHUB_OUTPUT
          else
            echo "mode=seance" >> $GITHUB_OUTPUT
          fi

      - name: Exécuter
        env:
          URL_UNIVERS: ${{ secrets.URL_UNIVERS }}
          URL_SURVEILLANCE: ${{ secrets.URL_SURVEILLANCE }}
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          MODE: ${{ steps.moment.outputs.mode }}
        run: python executer.py

      - name: Mémoriser le budget consommé
        if: always()
        run: |
          if [[ -n $(git status --porcelain budget_notifications.json) ]]; then
            git config user.name "veille"
            git config user.email "veille@users.noreply.github.com"
            git add budget_notifications.json
            git commit -m "Budget : mise a jour"
            git pull --rebase --autostash || true
            git push
          else
            echo "Aucun changement."
          fi
