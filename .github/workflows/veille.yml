name: Portefeuille — rendez-vous du soir

# Un rendez-vous fixe par jour, après la clôture européenne. Le marché est
# fermé : on réfléchit sans pouvoir agir dans la précipitation.

on:
  schedule:
    - cron: "15 16 * * 1-5"    # 18h15 Paris (17h15 en hiver)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas numpy requests anthropic
      - name: Rendez-vous du soir
        env:
          URL_FEUILLE: ${{ secrets.URL_FEUILLE }}
          TICKERS_SURVEILLANCE: ${{ secrets.TICKERS_SURVEILLANCE }}
          URL_SURVEILLANCE: ${{ secrets.URL_SURVEILLANCE }}
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          CLE_ANTHROPIC: ${{ secrets.CLE_ANTHROPIC }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          REGLES_VEILLE: ${{ secrets.REGLES_VEILLE }}
          MODE_VEILLE: "soir"
          QUOTA_PAR_PASSAGE: "3"
        run: python veille.py
      - name: Mémoriser
        if: always()
        run: |
          if [[ -n $(git status --porcelain etat_veille.json) ]]; then
            git config user.name "veille"
            git config user.email "veille@users.noreply.github.com"
            git add etat_veille.json
            git commit -m "Veille : etat"
            git pull --rebase --autostash || true
            git push
          fi
