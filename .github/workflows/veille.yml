name: Veille portefeuille

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install yfinance pandas numpy requests anthropic

      - name: Lancer la veille
        env:
          URL_FEUILLE: ${{ secrets.URL_FEUILLE }}
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          CLE_ANTHROPIC: ${{ secrets.CLE_ANTHROPIC }}
          REGLES_VEILLE: ${{ secrets.REGLES_VEILLE }}
        run: python veille.py

      - name: Mémoriser les alertes déjà envoyées
        run: |
          if [[ -n $(git status --porcelain etat_veille.json) ]]; then
            git config user.name "veille"
            git config user.email "veille@users.noreply.github.com"
            git add etat_veille.json
            git commit -m "Veille : mise a jour de l etat"
            git push
          else
            echo "Aucun changement d'état."
          fi
