name: Événements — publications et dépêches

on:
  schedule:
    - cron: "00 6 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "00 13 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evenements:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install yfinance pandas numpy requests anthropic

      - name: Collecter les événements
        env:
          URL_FEUILLE: ${{ secrets.URL_FEUILLE }}
          URL_SURVEILLANCE: ${{ secrets.URL_SURVEILLANCE }}
          TICKERS_SURVEILLANCE: ${{ secrets.TICKERS_SURVEILLANCE }}
          TELEGRAM_JETON: ${{ secrets.TELEGRAM_JETON }}
          TELEGRAM_DESTINATAIRE: ${{ secrets.TELEGRAM_DESTINATAIRE }}
          CLE_ANTHROPIC: ${{ secrets.CLE_ANTHROPIC }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          JOURS_AVANT_PUBLICATION: "3"
          PLAFOND_MESSAGES: "12"
          SOURCES_STRICTES: "1"
        run: python veille_evenements.py

      - name: Mémoriser les événements transmis
        if: always()
        run: |
          if [[ -n $(git status --porcelain etat_evenements.json) ]]; then
            git config user.name "veille"
            git config user.email "veille@users.noreply.github.com"
            git add etat_evenements.json
            git commit -m "Evenements : etat"
            git pull --rebase --autostash || true
            git push
          fi
